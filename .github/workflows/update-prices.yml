name: Update Gas Prices on gh-pages

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - gh-pages
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "data/gas_prices.json"

# Permissions required for committing updated data to the repository
permissions:
  contents: write

# Prevent concurrent push collisions
concurrency:
  group: "update-prices"
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository on gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and process latest gas prices
        run: |
          python scripts/fetch_prices.py

      - name: Commit and push updated gas price data to gh-pages
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gas_prices.json
          if git diff --staged --quiet; then
            echo "No changes in gas price data."
          else
            git commit -m "Auto-update gas prices [skip ci]"
            git pull --rebase origin gh-pages || true
            git push origin gh-pages
          fi
