name: Update Gas Prices & Deploy to GitHub Pages

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
      - gh-pages
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "data/gas_prices.json"

# Permissions required for committing data and deploying to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and process latest gas prices
        run: |
          python scripts/fetch_prices.py

      - name: Commit and push updated gas price data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gas_prices.json
          if git diff --staged --quiet; then
            echo "No changes in gas price data."
          else
            git commit -m "Auto-update gas prices [skip ci]"
            TARGET_BRANCH="${{ github.ref_name }}"
            if [ -z "$TARGET_BRANCH" ]; then
              TARGET_BRANCH="gh-pages"
            fi
            git pull --rebase origin "$TARGET_BRANCH" || true
            git push origin "$TARGET_BRANCH" || echo "Push skipped or failed, proceeding to deployment"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
